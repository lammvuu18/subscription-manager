services:
  # 1. Backend Web Service
  - type: web
    name: subtracker-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: subtracker-db
          property: connectionString
      - key: DEV_BYPASS_AUTH
        value: "false"

  # 2. Frontend Static Site
  - type: static
    name: subtracker-client
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: subtracker-server
          property: host

databases:
  # 3. PostgreSQL Database
  - name: subtracker-db
    databaseName: subtracker
    user: postgres
    plan: free
