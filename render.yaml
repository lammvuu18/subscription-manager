services:
  # 1. Backend Web Service
  - type: web
    name: subtracker-server
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: subtracker-db
          property: connectionString
      - key: DEV_BYPASS_AUTH
        value: "false"

  # 2. Frontend Static Site
  - type: web
    name: subtracker-client
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://subtracker-server.onrender.com/api/subscriptions

databases:
  # 3. PostgreSQL Database
  - name: subtracker-db
    databaseName: subtracker
    user: postgres
    plan: free
